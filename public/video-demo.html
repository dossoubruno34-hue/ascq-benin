<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidéo Démo Officielle — ASCQ Bénin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 92, 48, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 92, 48, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 92, 48, 0); }
    }
    .cursor-pointer-active {
      animation: pulse-ring 1.5s infinite;
    }
    .progress-bar-glow {
      box-shadow: 0 0 8px rgba(0, 200, 100, 0.6);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased p-2 sm:p-4 min-h-screen flex flex-col justify-center items-center">

  <div class="max-w-5xl w-full bg-slate-950 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col">
    
    <!-- 1. EN-TÊTE DU LECTEUR MULTIMÉDIA OFFICIEL -->
    <header class="bg-slate-900/90 border-b border-slate-800 p-3 sm:p-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-white p-1 flex items-center justify-center shrink-0 border border-emerald-500 shadow-md">
          <span class="text-xl">🇧🇯</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded text-[11px] font-black uppercase bg-[#005c30] text-white tracking-wider">
              Démo Vidéo Officielle
            </span>
            <span id="badge-device" class="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
              📱 Mode Mobile PWA
            </span>
          </div>
          <h1 class="text-sm sm:text-base font-black text-white tracking-tight mt-0.5">
            Plateforme ASCQ Bénin — Guide Audio-Visuel Interactif
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Commutateur Son / Voix du Narrateur -->
        <button
          id="btn-toggle-audio"
          onclick="toggleVoice()"
          class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center gap-1.5 transition-all"
          title="Activer ou désactiver la voix-off synthétique"
        >
          <span id="icon-audio">🔊</span>
          <span id="label-audio" class="hidden sm:inline">Voix-off : Active</span>
        </button>

        <!-- Bascule Smartphone / PC -->
        <button
          onclick="toggleDeviceView()"
          class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center gap-1.5 transition-all"
        >
          <span id="btn-device-icon">💻</span>
          <span class="hidden sm:inline">Vue Écran</span>
        </button>
      </div>
    </header>

    <!-- 2. ZONE PRINCIPALE DE L'ÉCRAN DÉMO ANIMÉ (SCÈNE VIDÉO) -->
    <div class="relative bg-gradient-to-b from-slate-900 to-slate-950 p-4 sm:p-8 flex items-center justify-center min-h-[460px] overflow-hidden">
      
      <!-- Faux écran de smartphone ou d'ordinateur selon la vue -->
      <div id="device-container" class="w-full max-w-sm bg-white text-slate-900 rounded-[2.5rem] p-3 shadow-2xl border-4 border-slate-700 transition-all duration-500 relative min-h-[420px] flex flex-col justify-between overflow-hidden">
        
        <!-- En-tête mobile (Notch & Barre statut) -->
        <div id="phone-notch" class="flex justify-between items-center px-4 py-1.5 bg-slate-900 text-white rounded-t-[1.8rem] text-xs font-mono select-none">
          <span>09:41</span>
          <div class="w-16 h-3 bg-black rounded-full"></div>
          <div class="flex items-center gap-1">
            <span>5G</span>
            <span>100%</span>
          </div>
        </div>

        <!-- CONTENU DYNAMIQUE DU SCÉNARIO VIDÉO -->
        <div id="video-screen-content" class="flex-1 p-3 flex flex-col justify-between overflow-y-auto">
          <!-- Le contenu est injecté dynamiquement par JavaScript -->
        </div>

        <!-- Bouton Home tactile du smartphone -->
        <div id="phone-home" class="py-1 flex justify-center bg-white rounded-b-[1.8rem]">
          <div class="w-28 h-1 bg-slate-300 rounded-full"></div>
        </div>

        <!-- Curseur virtuel animé (simule les clics du doigt de l'utilisateur) -->
        <div id="virtual-cursor" class="absolute pointer-events-none w-8 h-8 rounded-full bg-emerald-500/40 border-2 border-emerald-600 shadow-xl transform -translate-x-1/2 -translate-y-1/2 transition-all duration-700 z-50 cursor-pointer-active hidden"></div>
      </div>

      <!-- BANDEAU SOUS-TITRES SYNCHRONISÉS & EXPLICATIONS DU NARRATEUR -->
      <div class="absolute bottom-3 left-4 right-4 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-3 shadow-xl flex items-start gap-3 z-40">
        <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0 font-black text-sm shadow-sm">
          🎙️
        </div>
        <div class="flex-1 min-w-0">
          <p id="subtitles-chapter" class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider">
            Introduction
          </p>
          <p id="subtitles-text" class="text-xs sm:text-sm font-semibold text-slate-100 leading-relaxed mt-0.5">
            Chargement de la démonstration officielle...
          </p>
        </div>
      </div>
    </div>

    <!-- 3. BARRE DE PROGRESSION & CONTRÔLES MULTIMÉDIA -->
    <div class="bg-slate-900 border-t border-slate-800 p-3 sm:p-4 space-y-3">
      
      <!-- Ligne de timeline / barre de défilement scrubbable -->
      <div class="flex items-center gap-3">
        <span id="time-current" class="text-xs font-mono font-bold text-slate-400 w-12 text-right">00:00</span>
        
        <div class="flex-1 bg-slate-800 h-2.5 rounded-full overflow-hidden cursor-pointer relative group" onclick="seekByClick(event)">
          <div id="video-progress" class="bg-gradient-to-r from-emerald-500 to-[#005c30] h-full w-0 rounded-full transition-all duration-300 progress-bar-glow"></div>
        </div>
        
        <span id="time-total" class="text-xs font-mono font-bold text-slate-400 w-12">03:00</span>
      </div>

      <!-- Commandes de lecture et sélection directe des chapitres -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        
        <!-- Boutons de commande -->
        <div class="flex items-center gap-2">
          <button
            id="btn-play-pause"
            onclick="togglePlay()"
            class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-md active:scale-95 transition-all flex items-center gap-2"
          >
            <span id="icon-play">▶️</span>
            <span id="label-play">Lecture Démo</span>
          </button>

          <button
            onclick="restartDemo()"
            class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold transition-all"
            title="Recommencer depuis le début"
          >
            🔄 Rejouer
          </button>

          <button
            onclick="nextStep()"
            class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold transition-all flex items-center gap-1"
          >
            <span>Étape suivante</span>
            <span>⏭️</span>
          </button>
        </div>

        <!-- Sélecteur rapide des 6 grands chapitres du guide -->
        <div class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 scrollbar-none text-xs font-bold">
          <button onclick="goToChapter(0)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800 shrink-0">
            1. PWA & Rôles
          </button>
          <button onclick="goToChapter(1)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">
            2. Connexion & Oubli
          </button>
          <button onclick="goToChapter(2)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">
            3. Planning Hebdo
          </button>
          <button onclick="goToChapter(3)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">
            4. Suivi PNSC & Gaps
          </button>
          <button onclick="goToChapter(4)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">
            5. RMA & Signature
          </button>
          <button onclick="goToChapter(5)" class="chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0">
            6. Périmètre 360°
          </button>
        </div>

      </div>

    </div>

  </div>

  <script>
    // ---------------------------------------------------------------------
    // SCÉNARIO DÉTAILLÉ DE LA DÉMO VIDÉO INTERACTIVE
    // ---------------------------------------------------------------------
    const CHAPTERS = [
      {
        id: "intro_pwa",
        title: "Chapitre 1 : Accueil, PWA & Installation sur Smartphone",
        duration: 30,
        subtitles: "Bienvenue sur l'application officielle ASCQ Bénin. Conçue comme une Progressive Web App, l'application s'installe d'un clic sur l'écran d'accueil de tout smartphone et fonctionne parfaitement en mode hors-ligne sans internet.",
        cursorTarget: { x: "50%", y: "30%" },
        render: () => `
          <div class="space-y-3">
            <div class="p-3 bg-[#005c30] text-white rounded-2xl flex items-center justify-between shadow-md">
              <div class="flex items-center gap-2">
                <span class="text-xl">🇧🇯</span>
                <div>
                  <h3 class="font-black text-xs leading-none">ASCQ Bénin</h3>
                  <p class="text-[11px] text-emerald-200">Politique Nationale de Santé</p>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-400 text-emerald-950">Officiel</span>
            </div>

            <!-- Bouton PWA mis en évidence -->
            <div class="p-3 bg-emerald-50 border-2 border-emerald-500 rounded-2xl flex items-center justify-between animate-bounce">
              <div class="flex items-center gap-2">
                <span class="text-lg">📲</span>
                <div>
                  <p class="font-extrabold text-xs text-emerald-900">Installer l'application</p>
                  <p class="text-[11px] text-emerald-700">Accès direct 1 clic sur mobile</p>
                </div>
              </div>
              <button class="px-3 py-1 bg-[#005c30] text-white text-xs font-bold rounded-lg shadow-sm">
                Installer
              </button>
            </div>

            <!-- Compteurs réels -->
            <div class="grid grid-cols-2 gap-2 text-center pt-2">
              <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[11px] text-slate-500 font-bold uppercase">ASCQ Inscrits</p>
                <p class="text-lg font-black text-slate-900">2 Déployés</p>
              </div>
              <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[11px] text-slate-500 font-bold uppercase">Relais (RC)</p>
                <p class="text-lg font-black text-[#005c30]">45 Déclarés</p>
              </div>
            </div>
          </div>
        `
      },
      {
        id: "connexion_oubli",

        cursorTarget: { x: "50%", y: "65%" },
        render: () => `
          <div class="space-y-3">
            <h3 class="font-black text-xs text-slate-900 uppercase tracking-tight text-center">Connexion à votre Espace</h3>
            <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 text-xs">
              <div>
                <label class="font-bold text-slate-700 block mb-0.5">Numéro de téléphone</label>
                <div class="p-2 bg-white border border-slate-300 rounded-xl font-mono font-bold text-slate-900 flex items-center justify-between">
                  <span>01 97 00 00 00</span>
                  <span class="text-emerald-600">✓</span>
                </div>
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-0.5">Mot de passe</label>
                <div class="p-2 bg-white border border-slate-300 rounded-xl font-mono text-slate-400">
                  ••••••••••••
                </div>
              </div>
              <div class="flex justify-end pt-1">
                <span class="text-[11px] text-emerald-800 font-black underline cursor-pointer bg-emerald-100 px-2 py-0.5 rounded">
                  Mot de passe oublié ?
                </span>
              </div>
            </div>

            <!-- Modale d'assistance simulée -->
            <div class="p-3 bg-amber-50 border border-amber-300 rounded-2xl text-xs space-y-1">
              <p class="font-extrabold text-amber-900 flex items-center gap-1">
                <span>🔑</span> Alerte transmise à l'Administrateur National
              </p>
              <p class="text-[11px] text-amber-800">
                Support d'urgence sur le terrain : <strong>01 69 03 14 63</strong> (Appel / WhatsApp).
              </p>
            </div>
          </div>
        `
      },
      {
        id: "planning_hebdo",
        title: "Chapitre 3 : Planning Hebdomadaire (Semaines 1 à 52) & Signature Tactile",
        duration: 30,
        subtitles: "Le planning des ASCQ est strictement hebdomadaire. L'agent sélectionne sa semaine, visualise automatiquement les dates du Lundi au Dimanche, saisit son programme journalier et signe officiellement du doigt sur l'écran tactile.",
        cursorTarget: { x: "50%", y: "80%" },
        render: () => `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between bg-slate-100 p-2 rounded-xl text-xs">
              <span class="font-black text-slate-900">Semaine 43 (2026)</span>
              <span class="text-[11px] text-emerald-800 font-bold bg-emerald-100 px-2 py-0.5 rounded">Du Lun 20/10 au Dim 26/10</span>
            </div>

            <div class="space-y-1.5 text-xs max-h-44 overflow-y-auto pr-1">
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <span class="font-bold text-[#005c30]">Lundi</span> : Collecte fiches & supervision des 45 RC
              </div>
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <span class="font-bold text-[#005c30]">Mardi</span> : VAD ciblées mères & nourrissons
              </div>
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <span class="font-bold text-[#005c30]">Mercredi</span> : Sensibilisation hygiène & assainissement
              </div>
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <span class="font-bold text-[#005c30]">Jeudi</span> : Consultations soins iCCM & dépistage palu
              </div>
            </div>

            <!-- Signature tactile manuscrite -->
            <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl text-center">
              <p class="text-[11px] font-bold text-slate-500 uppercase">Signature manuscrite de l'ASCQ</p>
              <div class="h-10 bg-white border border-dashed border-emerald-400 rounded-lg flex items-center justify-center font-serif italic text-emerald-800 text-sm font-bold">
                ✍️ Bruno DOSSOU (Horodaté)
              </div>
            </div>
          </div>
        `
      },
      {
        id: "suivi_pnsc",
        title: "Chapitre 4 : Suivi Hebdo PNSC & Calculs Intelligents des Gaps",
        duration: 35,
        subtitles: "Le suivi hebdomadaire PNSC calcule automatiquement et intelligemment les gaps : besoins moins fonctionnels pour les ressources humaines, les motos et ordinateurs, ainsi que le cumul des mois d'arriérés de salaire avec export Excel instantané.",
        cursorTarget: { x: "50%", y: "55%" },
        render: () => `

            <div class="p-2 bg-[#005c30] text-white rounded-xl flex justify-between items-center">

              <span class="text-[11px] bg-white/20 px-2 py-0.5 rounded font-mono">Semaine 43</span>
            </div>

            <!-- Calcul automatique des gaps -->
            <div class="grid grid-cols-3 gap-1.5 text-center">
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Gap RH</p>
                <p class="text-sm font-black text-red-600">0 (10/10)</p>
              </div>
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Gap Motos</p>
                <p class="text-sm font-black text-amber-600">0 (1/1)</p>
              </div>
              <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Arriérés</p>
                <p class="text-sm font-black text-slate-900">0 Mois</p>
              </div>
            </div>

            <!-- Dotations -->
            <div class="p-2 bg-emerald-50 border border-emerald-200 rounded-xl space-y-1">
              <div class="flex justify-between items-center text-[11px]">
                <span class="font-bold text-emerald-900">📶 Forfait internet reçu :</span>
                <span class="font-extrabold text-[#005c30]">OUI (5 Go)</span>
              </div>
              <div class="flex justify-between items-center text-[11px]">
                <span class="font-bold text-emerald-900">⛽ Carburant reçu :</span>
                <span class="font-extrabold text-[#005c30]">OUI (Dotation hebdo)</span>
              </div>
            </div>

            <!-- Boutons Exports Excel -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button class="p-2 bg-emerald-700 text-white rounded-xl font-bold text-[11px] shadow-sm flex items-center justify-center gap-1">
                <span>📊 Fiche Excel ASCQ</span>
              </button>
              <button class="p-2 bg-slate-900 text-white rounded-xl font-bold text-[11px] shadow-sm flex items-center justify-center gap-1">
                <span>📑 Compilation Communale</span>
              </button>
            </div>
          </div>
        `
      },
      {
        id: "rma_signature",
        title: "Chapitre 5 : Rapport Mensuel d'Activité (RMA) — Signature Exclusive ASCQ",
        duration: 25,
        subtitles: "Le RMA consolide toutes les activités de santé et la surveillance One Health. La signature du MCC a été définitivement supprimée : l'ASCQ est désormais le seul et unique signataire officiel engageant sa responsabilité sur le document.",
        cursorTarget: { x: "50%", y: "75%" },
        render: () => `
          <div class="space-y-3 text-xs">
            <div class="p-2.5 bg-slate-100 rounded-xl flex items-center justify-between">
              <div>
                <h4 class="font-black text-slate-900">Rapport Mensuel RMA</h4>
                <p class="text-[11px] text-slate-500">Mois d'Octobre 2026</p>
              </div>
              <span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800">VALIDE</span>
            </div>

            <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1 text-[11px]">
              <div class="flex justify-between"><span>Relais actifs en charge :</span><strong>45 RC</strong></div>
              <div class="flex justify-between"><span>Ménages visités :</span><strong>142 ménages</strong></div>
              <div class="flex justify-between"><span>Cas de paludisme dépistés (TDR) :</span><strong>38 négatifs / 12 positifs</strong></div>
              <div class="flex justify-between"><span>Surveillance One Health (Rage) :</span><strong>0 morsure suspecte</strong></div>
            </div>

            <!-- Encart signature exclusive sans MCC -->
            <div class="p-2.5 bg-emerald-50 border-2 border-emerald-600 rounded-xl text-center space-y-1">
              <p class="font-extrabold text-[#005c30] text-[11px]">
                Engagement sur l'honneur — Signature Unique de l'ASCQ
              </p>
              <p class="text-[10px] text-slate-500">Visa MCC retiré • Document certifié par l'agent de terrain</p>
              <div class="h-8 bg-white border border-emerald-300 rounded flex items-center justify-center font-bold text-emerald-900 font-serif">
                ✍️ Bruno DOSSOU (ASCQ Certifié)
              </div>
            </div>
          </div>
        `
      },
      {
        id: "perimetre_admin",
        title: "Chapitre 6 : Espace Périmètre, Modification Justifiée & Nomination Territoriale",
        duration: 30,
        subtitles: "Dans l'espace Périmètre, le Super Administrateur recherche n'importe quel ASCQ, consulte son dossier 360° complet avec ses relais et rapports, modifie ses informations avec justification obligatoire et le nomme Représentant Communal ou Départemental.",
        cursorTarget: { x: "50%", y: "45%" },
        render: () => `
          <div class="space-y-2.5 text-xs">
            <div class="p-2 bg-gradient-to-r from-[#005c30] to-emerald-800 text-white rounded-xl flex justify-between items-center">
              <span class="font-black">Supervision du Périmètre 360°</span>
              <span class="text-[10px] bg-amber-400 text-amber-950 font-black px-2 py-0.5 rounded">Admin National</span>
            </div>

            <!-- Fiche de l'ASCQ trouvé -->
            <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
              <div class="flex items-center justify-between">
                <div>
                  <h4 class="font-black text-slate-900 text-xs uppercase">DOSSOU Bruno (ASCQ)</h4>
                  <p class="text-[11px] text-slate-500 font-mono">01 69 03 14 63 • Littoral</p>
                </div>
                <span class="px-2 py-0.5 bg-emerald-100 text-[#005c30] font-black rounded text-[10px]">ACTIF</span>
              </div>
              <p class="text-[10px] text-slate-600">45 Relais Communautaires supervisés • Source : LLF</p>
            </div>

            <!-- Les 3 actions majeures -->
            <div class="grid grid-cols-3 gap-1 text-center">
              <div class="p-1.5 bg-amber-500 text-white rounded-xl font-bold text-[10px] shadow-sm">
                👑 Nommer Représentant
              </div>
              <div class="p-1.5 bg-slate-900 text-white rounded-xl font-bold text-[10px] shadow-sm">
                ✏️ Modifier (Justifié)
              </div>
              <div class="p-1.5 bg-emerald-700 text-white rounded-xl font-bold text-[10px] shadow-sm">

            </div>

            <div class="p-2 bg-amber-50 border border-amber-300 rounded-xl text-[10px] text-amber-900 font-medium">
              🔒 <strong>Traçabilité :</strong> La nomination confère l'accès aux rapports de toute la commune ou du département avec motif obligatoire.
            </div>
          </div>
        `
      }
    ];

    let currentChapterIndex = 0;
    let isPlaying = false;
    let isMuted = false;
    let timer = null;
    let elapsedSecondsInChapter = 0;
    let isDesktopView = false;

    // Calcul du temps total
    const totalDurationSeconds = CHAPTERS.reduce((acc, c) => acc + c.duration, 0);

    function init() {
      updateDisplay();
      document.getElementById("time-total").innerText = formatTime(totalDurationSeconds);
    }

    function updateDisplay() {
      const chapter = CHAPTERS[currentChapterIndex];
      
      // Mettre à jour les sous-titres et titres
      document.getElementById("subtitles-chapter").innerText = chapter.title;
      document.getElementById("subtitles-text").innerText = chapter.subtitles;
      
      // Injecter le contenu de la scène
      document.getElementById("video-screen-content").innerHTML = chapter.render();

      // Mettre en évidence le bouton de chapitre
      const btns = document.querySelectorAll(".chapter-btn");
      btns.forEach((b, idx) => {
        if (idx === currentChapterIndex) {
          b.className = "chapter-btn px-2.5 py-1.5 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800 shrink-0 font-black";
        } else {
          b.className = "chapter-btn px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0";
        }
      });

      // Animer le curseur virtuel
      const cursor = document.getElementById("virtual-cursor");
      cursor.classList.remove("hidden");
      cursor.style.left = chapter.cursorTarget.x;
      cursor.style.top = chapter.cursorTarget.y;

      // Lire la voix-off si activée
      if (isPlaying && !isMuted) {
        speakSubtitles(chapter.subtitles);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById("icon-play").innerText = isPlaying ? "⏸️" : "▶️";
      document.getElementById("label-play").innerText = isPlaying ? "Pause" : "Lecture Démo";

      if (isPlaying) {
        startTimer();
        speakSubtitles(CHAPTERS[currentChapterIndex].subtitles);
      } else {
        stopTimer();
        window.speechSynthesis && window.speechSynthesis.cancel();
      }
    }

    function startTimer() {
      stopTimer();
      timer = setInterval(() => {
        elapsedSecondsInChapter++;
        
        // Calcul du temps total écoulé
        let totalElapsed = 0;
        for (let i = 0; i < currentChapterIndex; i++) {
          totalElapsed += CHAPTERS[i].duration;
        }
        totalElapsed += elapsedSecondsInChapter;

        // Mise à jour de la barre de progression
        const pct = Math.min(100, (totalElapsed / totalDurationSeconds) * 100);
        document.getElementById("video-progress").style.width = pct + "%";
        document.getElementById("time-current").innerText = formatTime(totalElapsed);

        // Passage au chapitre suivant si la durée est écoulée
        if (elapsedSecondsInChapter >= CHAPTERS[currentChapterIndex].duration) {
          elapsedSecondsInChapter = 0;
          if (currentChapterIndex < CHAPTERS.length - 1) {
            currentChapterIndex++;
            updateDisplay();
          } else {
            // Fin de la démo
            togglePlay();
            currentChapterIndex = 0;
            elapsedSecondsInChapter = 0;
            updateDisplay();
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function goToChapter(index) {
      currentChapterIndex = index;
      elapsedSecondsInChapter = 0;
      updateDisplay();
      if (isPlaying) {
        startTimer();
      }
    }

    function nextStep() {
      currentChapterIndex = (currentChapterIndex + 1) % CHAPTERS.length;
      elapsedSecondsInChapter = 0;
      updateDisplay();
    }

    function restartDemo() {
      currentChapterIndex = 0;
      elapsedSecondsInChapter = 0;
      document.getElementById("video-progress").style.width = "0%";
      document.getElementById("time-current").innerText = "00:00";
      updateDisplay();
      if (!isPlaying) togglePlay();
    }

    function seekByClick(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      const targetTime = pct * totalDurationSeconds;

      let cum = 0;
      for (let i = 0; i < CHAPTERS.length; i++) {
        if (cum + CHAPTERS[i].duration >= targetTime) {
          currentChapterIndex = i;
          elapsedSecondsInChapter = Math.floor(targetTime - cum);
          break;
        }
        cum += CHAPTERS[i].duration;
      }
      updateDisplay();
    }

    function toggleVoice() {
      isMuted = !isMuted;
      document.getElementById("icon-audio").innerText = isMuted ? "🔇" : "🔊";
      document.getElementById("label-audio").innerText = isMuted ? "Voix-off : Muet" : "Voix-off : Active";
      if (isMuted && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      } else if (!isMuted && isPlaying) {
        speakSubtitles(CHAPTERS[currentChapterIndex].subtitles);
      }
    }

    function speakSubtitles(text) {
      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "fr-FR";
      utterance.rate = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function toggleDeviceView() {
      isDesktopView = !isDesktopView;
      const container = document.getElementById("device-container");
      const notch = document.getElementById("phone-notch");
      const home = document.getElementById("phone-home");
      const badge = document.getElementById("badge-device");
      const btnIcon = document.getElementById("btn-device-icon");

      if (isDesktopView) {
        container.classList.remove("max-w-sm", "rounded-[2.5rem]");
        container.classList.add("max-w-xl", "rounded-2xl");
        notch.classList.add("hidden");
        home.classList.add("hidden");
        badge.innerText = "💻 Mode Écran PC";
        btnIcon.innerText = "📱";
      } else {
        container.classList.add("max-w-sm", "rounded-[2.5rem]");
        container.classList.remove("max-w-xl", "rounded-2xl");
        notch.classList.remove("hidden");
        home.classList.remove("hidden");
        badge.innerText = "📱 Mode Mobile PWA";
        btnIcon.innerText = "💻";
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    window.onload = init;
  </script>

</body>
</html>
